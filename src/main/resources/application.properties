spring.application.name=library-api

# Optional local overrides (git-ignored). Copy application-local.properties.example to application-local.properties
spring.config.import=optional:file:./application-local.properties

# Database credentials come from environment variables (never commit the password)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
